name: Frontend checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SITE_URL: https://bidwell.example
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build-and-coverage
          path: |
            dist
            coverage
# This workflow is for the standalone frontend repository.
# Live end-to-end QA is run against an explicitly configured test backend;
# it is not triggered automatically against a public shared Groq account.
